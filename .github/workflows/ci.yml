name: CI

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - main

jobs:
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@11.1.2 --activate

      - name: Install dependencies
        run: PNPM_CONFIG_STRICT_DEP_BUILDS=false pnpm install --frozen-lockfile

      - name: Run typecheck if available
        run: pnpm run --if-present typecheck 

      - name: Run lint if available
        run: pnpm run --if-present lint

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: ""
        run: pnpm build

  backend:
    name: Backend Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: praktis
          POSTGRES_PASSWORD: praktis
          POSTGRES_DB: praktis
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U praktis -d praktis"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall .

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://praktis:praktis@localhost:5432/praktis
          POSTGRES_USER: praktis
          POSTGRES_PASSWORD: praktis
          POSTGRES_DB: praktis

          JWT_SECRET: ci_dummy_secret_key
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60

          MINIO_ENDPOINT: localhost:9000
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_BUCKET_NAME: praktis
          MINIO_USE_SSL: "false"
        run: alembic upgrade head

      - name: Run backend tests
        env:
          TEST_DATABASE_URL: postgresql://praktis:praktis@localhost:5432/praktis_test
          JWT_SECRET: ci_dummy_secret_key
          MINIO_ENDPOINT: localhost:9000
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        run: pytest

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=praktis
          POSTGRES_PASSWORD=praktis
          POSTGRES_DB=praktis

          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          MINIO_BUCKET_NAME=praktis-modules

          JWT_SECRET_KEY=ci_dummy_secret_key
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=60

          MINIO_USE_SSL=false
          EOF

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build Docker images
        run: docker compose build backend frontend